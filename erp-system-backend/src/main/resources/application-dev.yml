# Local development: PostgreSQL on localhost (default credentials for docker-less dev)
# Use port 8087 so we avoid clashing with Vzeeta (8081) / Mazaad (8085) / SRS (8080).
server:
  port: ${PORT:8087}

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASS:${SPRING_DATASOURCE_PASSWORD:admin}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: erp_system
  flyway:
    enabled: true
    baseline-on-migrate: true
    create-schemas: true
    repair-on-migrate: true
    schemas: erp_system
    locations: classpath:db/migration

# Local-only JWT default (never used by prod profile)
app:
  security:
    jwt:
      secret: ${JWT_SECRET:erp-system-super-secret-key-change-me-2026}
  license:
    signing-secret: ${LICENSE_SIGNING_SECRET:erp-dev-license-signing-secret-2026}
  backup:
    pg-dump-path: ${BACKUP_PG_DUMP_PATH:pg_dump}
    host: ${BACKUP_DB_HOST:localhost}
    port: ${BACKUP_DB_PORT:5432}
    db: ${BACKUP_DB_NAME:postgres}
    user: ${BACKUP_DB_USER:postgres}
    password: ${BACKUP_DB_PASSWORD:admin}
    dir: ${BACKUP_OUTPUT_DIR:./backups}
  erp:
    demo-data-enabled: ${ERP_DEMO_DATA_ENABLED:true}

<section class="erp-page erp-list-page erp-estate-fade-up">
  <app-page-header titleKey="MENU.POS_SHIFTS">
    <div header-actions class="erp-toolbar-icons">
      <a class="erp-button erp-button--primary" routerLink="/pos/start">
        <mat-icon aria-hidden="true">play_arrow</mat-icon>
        <span>{{ 'POS.OPEN_SHIFT' | translate }}</span>
      </a>
      <a class="erp-button erp-button--secondary" routerLink="/pos/sale">
        <mat-icon aria-hidden="true">shopping_cart</mat-icon>
        <span>{{ 'MENU.POS_SALE' | translate }}</span>
      </a>
      <button type="button" class="erp-button erp-button--secondary" (click)="loadShifts()">
        <mat-icon aria-hidden="true">refresh</mat-icon>
        <span>{{ 'COMMON.REFRESH' | translate }}</span>
      </button>
    </div>
  </app-page-header>

  <div class="erp-card erp-list-page__card">
    <div class="erp-card__body">
      <app-erp-alert *ngIf="errorKey" type="danger" [message]="errorKey" extraClass="mb-3" (dismissed)="errorKey = ''"></app-erp-alert>
      <app-erp-alert *ngIf="successKey" type="success" [message]="successKey" extraClass="mb-3" (dismissed)="successKey = ''"></app-erp-alert>
      <app-data-table [columns]="columns" [data]="rows" [actions]="actions" [loading]="loading" (actionClick)="onTableAction($event)"></app-data-table>
    </div>
  </div>
</section>

<app-erp-dialog [visible]="closeVisible" titleKey="POS.CLOSE_SHIFT" size="md" (close)="closeVisible = false">
  <div dialog-body>
    <form [formGroup]="closeForm" class="erp-dialog-form">
      <div class="mb-3">
        <app-form-field
          [control]="closeForm.controls.closingCash"
          labelKey="POS.CLOSING_CASH"
          icon="payments"
          type="number"
          step="0.01"
          min="0"
        ></app-form-field>
      </div>
      <div class="mb-3">
        <app-form-field [control]="closeForm.controls.notes" labelKey="ERP.NOTES" icon="edit" type="text"></app-form-field>
      </div>
      <p *ngIf="selectedShift as shift" class="text-muted mb-0">
        {{ 'POS.OPENING_CASH' | translate }}: {{ shift.openingCash | number:'1.2-2' }} —
        {{ 'POS.PAY_CASH' | translate }}: {{ shift.cashSales || 0 | number:'1.2-2' }}
      </p>
    </form>
  </div>
  <div dialog-footer class="d-flex gap-2 justify-content-end">
    <button type="button" class="erp-button erp-button--secondary" (click)="closeVisible = false">{{ 'COMMON.CLOSE' | translate }}</button>
    <button type="button" class="erp-button erp-button--primary" [disabled]="saving" (click)="submitClose()">{{ 'POS.CLOSE_SHIFT' | translate }}</button>
  </div>
</app-erp-dialog>

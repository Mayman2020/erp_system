<section class="erp-page erp-list-page erp-estate-fade-up">
  <app-page-header titleKey="POS.OPEN_SHIFT">
    <div header-actions class="erp-toolbar-icons">
      <a class="erp-button erp-button--secondary" routerLink="/pos/shifts">
        <mat-icon aria-hidden="true">schedule</mat-icon>
        <span>{{ 'MENU.POS_SHIFTS' | translate }}</span>
      </a>
    </div>
  </app-page-header>

  <div class="erp-card erp-list-page__card">
    <div class="erp-card__body">
      <app-erp-alert *ngIf="errorKey" type="danger" [message]="errorKey" extraClass="mb-3" (dismissed)="errorKey = ''"></app-erp-alert>
      <app-erp-alert *ngIf="successKey" type="success" [message]="successKey" extraClass="mb-3" (dismissed)="successKey = ''"></app-erp-alert>

      <form [formGroup]="form" class="erp-dialog-form" (ngSubmit)="openShift()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <app-searchable-select
              formControlName="terminalId"
              label="POS.TERMINAL"
              placeholder="LOV.SELECT_PLACEHOLDER"
              bindLabel="label"
              bindValue="id"
              [items]="terminalLovItems"
              [clearable]="false"
              [required]="true"
              (selectionChange)="onTerminalChange()">
            </app-searchable-select>
          </div>
          <div class="col-md-6 mb-3">
            <app-form-field
              [control]="form.controls.openingCash"
              labelKey="POS.OPENING_CASH"
              icon="payments"
              type="number"
              step="0.01"
              min="0"
            ></app-form-field>
          </div>
          <div class="col-12 mb-3">
            <app-form-field [control]="form.controls.notes" labelKey="ERP.NOTES" icon="edit" type="text"></app-form-field>
          </div>
        </div>
        <div class="d-flex gap-2 justify-content-end">
          <button type="submit" class="erp-button erp-button--primary" [disabled]="saving || loading">
            <mat-icon aria-hidden="true">play_arrow</mat-icon>
            <span>{{ 'POS.OPEN_SHIFT' | translate }}</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

<section class="erp-page erp-list-page erp-estate-fade-up">
  <app-page-header [titleKey]="'DIGITAL.TITLE'">
    <div header-actions class="erp-toolbar-icons">
      <button
        class="erp-button erp-button--primary"
        type="button"
        (click)="openCreate()"
        [ngbTooltip]="'COMMON.ADD' | translate"
        placement="top"
        container="body"
        [attr.aria-label]="'COMMON.ADD' | translate">
        <mat-icon aria-hidden="true">add</mat-icon><span>{{ 'COMMON.ADD' | translate }}</span>
      </button>
    </div>
  </app-page-header>
  <div class="erp-card erp-list-page__card"><div class="erp-card__body">
    <div class="digital-tabs mb-3">
      <button type="button" class="erp-button" [class.erp-button--primary]="activeTab === 'courses'" (click)="setTab('courses')">{{ 'DIGITAL.COURSES' | translate }}</button>
      <button type="button" class="erp-button" [class.erp-button--primary]="activeTab === 'enrollments'" (click)="setTab('enrollments')">{{ 'DIGITAL.ENROLLMENTS' | translate }}</button>
    </div>
    <app-data-table [columns]="columns" [data]="rows" [actions]="actions" [loading]="loading" (actionClick)="onTableAction($event)"></app-data-table>
  </div></div>
</section>
<app-erp-dialog [visible]="formVisible" [titleKey]="'COMMON.EDIT'" size="lg" (close)="closeForm()">
  <div dialog-body>
    <form *ngIf="activeTab === 'courses'" [formGroup]="courseForm"><div class="row">
      <div class="col-md-4 mb-3"><app-form-field [control]="courseForm.controls.code" labelKey="ERP.CODE"></app-form-field></div>
      <div class="col-md-8 mb-3"><app-form-field [control]="courseForm.controls.title" labelKey="COMMON.TITLE"></app-form-field></div>
      <div class="col-12 mb-3"><app-form-field [control]="courseForm.controls.description" labelKey="COMMON.DESCRIPTION" type="textarea" [rows]="3"></app-form-field></div>
    </div></form>
    <form *ngIf="activeTab === 'enrollments'" [formGroup]="enrollmentForm"><div class="row">
      <div class="col-md-6 mb-3">
        <app-searchable-select
          formControlName="courseId"
          label="DIGITAL.COURSES"
          placeholder="LOV.SELECT_PLACEHOLDER"
          bindLabel="label"
          bindValue="id"
          [items]="courseLovItems"
          [clearable]="false"
          [required]="true">
        </app-searchable-select>
      </div>
      <div class="col-md-6 mb-3">
        <app-searchable-select
          formControlName="employeeId"
          label="MENU.EMPLOYEES"
          placeholder="LOV.SELECT_PLACEHOLDER"
          bindLabel="label"
          bindValue="id"
          [items]="employeeLovItems"
          [clearable]="false"
          [required]="true">
        </app-searchable-select>
      </div>
      <div class="col-md-4 mb-3"><app-form-field [control]="enrollmentForm.controls.progressPct" labelKey="DIGITAL.PROGRESS" type="number"></app-form-field></div>
      <div class="col-md-4 mb-3"><app-form-field [control]="enrollmentForm.controls.status" labelKey="COMMON.STATUS"></app-form-field></div>
    </div></form>
    <app-erp-audit-trail
      *ngIf="editingId && selectedAuditRecord as audit"
      [createdAt]="audit.createdAt"
      [updatedAt]="audit.updatedAt"
      [createdBy]="audit.createdBy"
      [updatedBy]="audit.updatedBy">
    </app-erp-audit-trail>
  </div>
  <div dialog-footer class="d-flex gap-2 justify-content-end">
    <button type="button" class="erp-button erp-button--secondary" (click)="closeForm()">{{ 'COMMON.CLOSE' | translate }}</button>
    <button type="button" class="erp-button erp-button--primary" (click)="save()">{{ 'COMMON.SAVE' | translate }}</button>
  </div>
</app-erp-dialog>

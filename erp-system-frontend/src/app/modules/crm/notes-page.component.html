<section class="erp-page erp-list-page erp-estate-fade-up">
  <app-page-header [titleKey]="titleKey">
    <app-erp-master-page-actions
      header-actions
      [canCreate]="canCreate"
      [canExport]="canExport"
      [createKey]="config.createKey"
      [titleKey]="titleKey"
      [exportFileName]="exportFileName"
      [exportColumns]="exportColumns"
      [rows]="rows"
      [menuItemId]="config.menuItemId || ''"
      [disabled]="listLoad.refreshing"
      (create)="openCreate()">
    </app-erp-master-page-actions>
  </app-page-header>

  <app-erp-master-list-shell
    [listLoad]="listLoad"
    [showSearch]="showSearch"
    [showDateRange]="showDateRange"
    [showStatus]="showStatus"
    [statusOptions]="statusOptions"
    [errorKey]="errorKey"
    [successKey]="successKey"
    [formVisible]="formVisible"
    [columns]="columns"
    [pagedRows]="pagedRows"
    [actions]="actions"
    [totalElements]="totalElements"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    (search)="onSearch($event)"
    (pageIndexChange)="onPageChange($event)"
    (actionClick)="onTableAction($event)"
    (dismissError)="errorKey = ''"
    (dismissSuccess)="successKey = ''">
  </app-erp-master-list-shell>
</section>
<app-erp-dialog [visible]="formVisible" [titleKey]="formMode === 'create' ? 'ERP.CREATE_NOTE' : 'COMMON.EDIT'" size="lg" (close)="closeForm()">
  <div dialog-body><form [formGroup]="form"><div class="row">
    <div class="col-md-4 mb-3"><app-form-field [control]="form.controls.entityType" labelKey="ERP.ENTITY_TYPE" [readonly]="readOnly"></app-form-field></div>
    <div class="col-md-4 mb-3" *ngIf="form.controls.entityType.value === 'LEAD'; else manualEntityId">
      <app-searchable-select
        formControlName="entityId"
        label="MENU.LEADS"
        placeholder="LOV.SELECT_PLACEHOLDER"
        bindLabel="label"
        bindValue="id"
        [items]="leadLovItems"
        [clearable]="false"
        [required]="true">
      </app-searchable-select>
    </div>
    <ng-template #manualEntityId>
      <div class="col-md-4 mb-3"><app-form-field [control]="form.controls.entityId" labelKey="COMMON.ID" type="number" [readonly]="readOnly"></app-form-field></div>
    </ng-template>
    <div class="col-12 mb-3"><app-form-field [control]="form.controls.content" labelKey="ERP.NOTE_CONTENT" type="textarea" [rows]="4" [readonly]="readOnly"></app-form-field></div>
  </div></form>
  <app-erp-audit-trail
    *ngIf="formMode !== 'create' && selectedAuditRecord as audit"
    [createdAt]="audit.createdAt"
    [updatedAt]="audit.updatedAt"
    [createdBy]="audit.createdBy"
    [updatedBy]="audit.updatedBy">
  </app-erp-audit-trail>
  </div>
  <div dialog-footer class="d-flex gap-2 justify-content-end"><button type="button" class="erp-button erp-button--secondary" (click)="closeForm()">{{ 'COMMON.CLOSE' | translate }}</button><button *ngIf="!readOnly" type="button" class="erp-button erp-button--primary" [disabled]="saving" (click)="save()">{{ 'COMMON.SAVE' | translate }}</button></div>
</app-erp-dialog>

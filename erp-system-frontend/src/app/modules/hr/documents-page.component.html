<section class="erp-page erp-list-page erp-estate-fade-up">
  <app-page-header [titleKey]="titleKey">
    <app-erp-master-page-actions
      header-actions
      [canCreate]="canCreate"
      [canExport]="canExport"
      [createKey]="config.createKey"
      [titleKey]="titleKey"
      [exportFileName]="exportFileName"
      [exportColumns]="exportColumns"
      [rows]="rows"
      [menuItemId]="config.menuItemId || ''"
      [disabled]="listLoad.refreshing"
      (create)="openCreate()">
    </app-erp-master-page-actions>
  </app-page-header>

  <app-erp-master-list-shell
    [listLoad]="listLoad"
    [showSearch]="showSearch"
    [showDateRange]="showDateRange"
    [showStatus]="showStatus"
    [statusOptions]="statusOptions"
    [errorKey]="errorKey"
    [successKey]="successKey"
    [formVisible]="formVisible"
    [columns]="columns"
    [pagedRows]="pagedRows"
    [actions]="actions"
    [totalElements]="totalElements"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [hideSearchBar]="true"
    (search)="onSearch($event)"
    (pageIndexChange)="onPageChange($event)"
    (actionClick)="onTableAction($event)"
    (dismissError)="errorKey = ''"
    (dismissSuccess)="successKey = ''">
    <div list-filters class="row mb-3">
      <div class="col-md-4">
        <app-searchable-select
          [ngModel]="filterEmployeeId"
          (ngModelChange)="onEmployeeFilterChange($event)"
          label="MENU.EMPLOYEES"
          placeholder="COMMON.ALL"
          bindLabel="label"
          bindValue="id"
          [items]="employeeLovItems"
          [clearable]="true">
        </app-searchable-select>
      </div>
    </div>
  </app-erp-master-list-shell>
</section>

<app-erp-dialog [visible]="formVisible" [titleKey]="formMode === 'create' ? 'ERP.CREATE_DOCUMENT' : 'COMMON.EDIT'" size="lg" (close)="closeForm()">
  <div dialog-body>
    <form [formGroup]="form" class="erp-dialog-form">
      <div class="mb-3">
        <app-searchable-select
          formControlName="employeeId"
          label="MENU.EMPLOYEES"
          placeholder="LOV.SELECT_PLACEHOLDER"
          bindLabel="label"
          bindValue="id"
          [items]="employeeLovItems"
          [clearable]="false"
          [required]="true">
        </app-searchable-select>
      </div>
      <app-form-field [control]="form.controls.documentType" labelKey="ERP.DOCUMENT_TYPE" [readonly]="readOnly"></app-form-field>
      <app-form-field [control]="form.controls.fileName" labelKey="ERP.FILE_NAME" [readonly]="readOnly"></app-form-field>
      <app-form-field [control]="form.controls.filePath" labelKey="ERP.FILE_PATH" [readonly]="readOnly"></app-form-field>
      <app-form-field [control]="form.controls.expiryDate" labelKey="ERP.EXPIRY_DATE" type="date" [readonly]="readOnly"></app-form-field>
    </form>
    <app-erp-audit-trail
      *ngIf="formMode !== 'create' && selectedAuditRecord as audit"
      [createdAt]="audit.createdAt"
      [updatedAt]="audit.updatedAt"
      [createdBy]="audit.createdBy"
      [updatedBy]="audit.updatedBy">
    </app-erp-audit-trail>
  </div>
  <div dialog-footer class="d-flex gap-2 justify-content-end">
    <button type="button" class="erp-button erp-button--secondary" (click)="closeForm()">{{ 'COMMON.CLOSE' | translate }}</button>
    <button *ngIf="!readOnly" type="button" class="erp-button erp-button--primary" [disabled]="saving" (click)="save()">{{ 'COMMON.SAVE' | translate }}</button>
  </div>
</app-erp-dialog>

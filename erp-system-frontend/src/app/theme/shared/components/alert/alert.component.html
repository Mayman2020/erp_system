<div #alert class="alert alert-{{type}}" role="alert" [ngClass]="{'alert-dismissible': dismiss}">
  <ng-content></ng-content>
  <button *ngIf="dismiss" (click)="dismissAlert(alert)" type="button" class="close" data-dismiss="alert"
    [ngbTooltip]="closeLabel" placement="top" container="body"
    [attr.aria-label]="closeLabel"><span aria-hidden="true">&times;</span></button>
</div>

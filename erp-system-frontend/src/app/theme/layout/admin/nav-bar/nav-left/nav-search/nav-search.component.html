<a href="javascript:" class="pop-search" (click)="isSearch = true"
  [ngbTooltip]="'COMMON.SEARCH' | translate" placement="bottom" container="body"
  [attr.aria-label]="'COMMON.SEARCH' | translate"><mat-icon aria-hidden="true">search</mat-icon></a>
<div class="search-bar" *ngIf="isSearch">
  <input type="text" class="erp-input border-0 shadow-none" [placeholder]="'COMMON.SEARCH' | translate">
  <button type="button" class="close" [attr.aria-label]="'COMMON.CLOSE' | translate"
    [ngbTooltip]="'COMMON.CLOSE' | translate" placement="bottom" container="body"
    (click)="isSearch = false">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>

<section class="erp-page erp-list-page erp-estate-fade-up">
  <app-page-header [titleKey]="'BACKUPS.TITLE'">
    <div header-actions class="erp-toolbar-icons">
      <button class="erp-button erp-button--primary" type="button" [disabled]="creating" (click)="createBackup()">
        <mat-icon>backup</mat-icon><span>{{ 'BACKUPS.CREATE' | translate }}</span>
      </button>
    </div>
  </app-page-header>
  <div class="erp-card erp-list-page__card"><div class="erp-card__body">
    <app-data-table [columns]="columns" [data]="tableRows" [actions]="actions" [loading]="loading" (actionClick)="onAction($event)"></app-data-table>
  </div></div>
</section>
